plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '5.14.0'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.+"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = System.getenv("MOD_VERSION")
        ? System.getenv("MOD_VERSION")
        : "0.0.1-alpha"
group = project.maven_group

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url "https://maven.shedaniel.me"
        content {
            includeGroup "me.sargunvohra.mcmods"
            includeGroup "me.shedaniel.cloth"
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.terraformersmc.com"
        content {
            includeGroup "com.terraformersmc"
            includeGroup "dev.emi"
        }
    }
    maven {
        name 'modmaven'
        url "https://modmaven.dev/"
        content {
            includeGroup "mezz.jei"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    compileOnly fg.deobf("maven.modrinth:ae2:${project.ae2_version}")
    compileOnly fg.deobf("maven.modrinth:thermal-expansion:${project.thermal_expansion_version}")
    // Also load them in local dev runs so interoperability can be tested in-game.
    runtimeOnly fg.deobf("maven.modrinth:ae2:${project.ae2_version}")
    runtimeOnly fg.deobf("maven.modrinth:guideme:${project.guideme_version}")
    runtimeOnly fg.deobf("maven.modrinth:cofh-core:${project.cofh_core_version}")
    runtimeOnly fg.deobf("maven.modrinth:thermal-foundation:${project.thermal_version}")
    runtimeOnly fg.deobf("maven.modrinth:thermal-expansion:${project.thermal_expansion_version}")


    compileOnly(fg.deobf("mezz.jei:jei-${project.jei_minecraft_version}-forge:${project.jei_version}")) {
        exclude group: "mezz.jei"
    }
    runtimeOnly(fg.deobf("mezz.jei:jei-${project.jei_minecraft_version}-forge:${project.jei_version}")) {
        exclude group: "mezz.jei"
    }
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}")
    // REI's Forge POM declares these transitive compile dependencies, but they are not exposed
    // reliably through fg.deobf for source compilation, so declare them explicitly.
    compileOnly fg.deobf("dev.architectury:architectury-forge:9.0.7")
    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.0.99")

    compileOnly fg.deobf("dev.emi:emi-forge:${project.emi_version}+${project.emi_minecraft_version}")
//    runtimeOnly fg.deobf("dev.emi:emi-forge:${project.emi_version}+${project.emi_minecraft_version}")

}

def processResourcesOutput = layout.buildDirectory.dir('resources/main')

tasks.register('cleanProcessResourcesOutput', Delete) {
    delete(processResourcesOutput)
}

processResources {
    inputs.property "version", project.version
    dependsOn tasks.named('cleanProcessResourcesOutput')

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

sourceSets {
    main {
        java {
            srcDir "src/client/java"
            exclude "dev/technici4n/moderndynamics/client/data/**"
            exclude "dev/technici4n/moderndynamics/client/model/MdModelLoader.java"
            exclude "dev/technici4n/moderndynamics/data/**"
            exclude "dev/technici4n/moderndynamics/compat/mi/**"
            exclude "dev/technici4n/moderndynamics/network/mienergy/**"
            exclude "dev/technici4n/moderndynamics/network/energy/**"
            exclude "dev/technici4n/moderndynamics/pipe/EnergyPipeBlockEntity.java"
            exclude "dev/technici4n/moderndynamics/pipe/MIEnergyCableBlockEntity.java"
            exclude "dev/technici4n/moderndynamics/test/**"
        }
        resources {
            srcDir "src/generated/resources"
            exclude "fabric.mod.json"
            exclude "moderndynamics.accesswidener"
            exclude "data/moderndynamics/recipes/cable/**"
            exclude "data/moderndynamics/advancements/recipes/cable/**"
            exclude "data/moderndynamics/loot_tables/blocks/lv_cable.json"
            exclude "data/moderndynamics/loot_tables/blocks/mv_cable.json"
            exclude "data/moderndynamics/loot_tables/blocks/hv_cable.json"
            exclude "data/moderndynamics/loot_tables/blocks/ev_cable.json"
            exclude "data/moderndynamics/loot_tables/blocks/superconductor_cable.json"
        }
    }
}

minecraft {
    mappings channel: 'parchment', version: "${project.parchment_version}-${project.minecraft_version}"
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                moderndynamics {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'moderndynamics'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'moderndynamics'
            arg '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'moderndynamics', '--all', '--output', file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'

        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
    java {
        importOrder()

        eclipse().configFile('eclipse-format.xml')

        indentWithSpaces()
        endWithNewline()
        licenseHeaderFile 'license_header.java'
    }
    format 'json', {
        target 'src/**/lang/*.json'
        addStep(JsonOrderStep.create())
    }
}

import com.diffplug.spotless.FormatterFunc
import com.diffplug.spotless.FormatterStep
import com.google.gson.Gson
import com.google.gson.GsonBuilder

final class JsonOrderStep {
    private JsonOrderStep() {}
    private static final Gson GSON = new GsonBuilder().disableHtmlEscaping().setLenient().setPrettyPrinting().create();

    static FormatterStep create() {
        return FormatterStep.create(
                'jsonOrderStep',
                new State(),
                {
                    new FormatterFunc() {
                        String apply(String input) {
                            TreeMap<String, Object> jsonMap = GSON.fromJson(input, TreeMap.class);
                            String sortedJson = GSON.toJson(jsonMap);
                            String prettyPrinted = sortedJson.replace('  "', '    "').replace('\\u0027', '\'');
                            return prettyPrinted;
                        }
                    }
                },
        );
    }

    private static final class State implements Serializable {
        private static final long serialVersionUID = 1L;

        private final int formatVersion = 1;
    }
}

def releaseChannel = "release"
def changelog = "Please visit our github repository for a changelog: https://github.com/Technici4n/Modern-Dynamics/releases."
if (version.toLowerCase().contains("alpha")) {
    releaseChannel = "alpha"
    changelog = "THIS IS AN ALPHA RELEASE, MAKE A BACKUP BEFORE INSTALLING AND FREQUENTLY WHILE PLAYING, AND PLEASE REPORT ANY ISSUE YOU MAY FIND ON OUR ISSUE TRACKER.\n\n" + changelog
} else if (version.toLowerCase().contains("beta")) {
    releaseChannel = "beta"
    changelog = "This is a beta release. It is expected to be mostly stable, but in any case please report any issue you may find.\n\n" + changelog
}

if (System.getenv("CURSEFORGE_API_KEY") && !version.endsWith("-SNAPSHOT")) {
    curseforge {
        apiKey = System.getenv().get("CURSEFORGE_API_KEY")
        project {
            id = project.curseforge_project
            releaseType = releaseChannel
            changelogType = "markdown"
            delegate.changelog = changelog

            addGameVersion "1.20.1"
            addGameVersion "Forge"
            addGameVersion "Java 17"

            mainArtifact(jar.archiveFile) {
                displayName = "Modern Dynamics v${version}"
            }
        }
        options {
            forgeGradleIntegration = false
        }
        afterEvaluate {
            tasks.getByName("curseforge${project.curseforge_project}").dependsOn jar
        }
    }
}

if (System.getenv("MODRINTH_API_KEY") && !version.endsWith("-SNAPSHOT")) {
    modrinth {
        token = System.getenv("MODRINTH_API_KEY")
        projectId = project.modrinth_project
        versionNumber = version
        versionName = "Modern Dynamics v${version}"
        delegate.changelog = changelog
        versionType = releaseChannel.toUpperCase()
        uploadFile = jar.archiveFile
        gameVersions = ["1.20.1"]
        loaders = ["forge"]
    }
}
